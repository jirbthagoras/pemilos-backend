server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: access-log
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/nginx/log/*.log
      - targets:
          - localhost
        labels:
          job: nginx-2
          __path__: /var/log/nginx/access.log